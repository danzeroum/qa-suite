# SMOKE-TEST do pipeline de estabilidade — NÃO é a medição oficial.
#
# EMENDA de arquitetura (2026-07-30): o ambiente oficial passou a ser o
# container Docker da VPS (imagem fixada por digest), que roda o noturno e é o
# ÚNICO escritor do ledger. Ver docs/VPS.md.
#
# Este workflow perdeu a caneta e ficou com os olhos: roda a dimensão contra o
# alvo fixture e classifica em --dry-run, para diagnosticar o pipeline pelo
# GitHub sem escrever nada. Dois escritores no mesmo arquivo é conflito de push
# às 3h da manhã — por isso o `schedule` foi removido, não apenas desativado.
#
# Como consequência da emenda, a origem aqui NÃO é declarada: sem
# WEBQA_ORIGEM=vps a entrada seria classificada como "local" e não contaria.
# O --dry-run torna isso explícito — este caminho não pode mover a métrica.
name: Estabilidade (smoke-test, sem escrita)

on:
  workflow_dispatch:

# Nenhum job deste workflow escreve no repositório.
permissions:
  contents: read

concurrency:
  group: estabilidade
  cancel-in-progress: false

defaults:
  run:
    working-directory: webqa-suite

jobs:
  medir:
    name: Smoke-test da medição (dry-run, não escreve o ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webqa-suite/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Subir o alvo fixture
        run: |
          nohup python fixture_target/servir.py --url-file "$RUNNER_TEMP/alvo.url" \
            > "$RUNNER_TEMP/alvo.log" 2>&1 &
          for _ in $(seq 1 30); do
            [ -s "$RUNNER_TEMP/alvo.url" ] && break
            sleep 1
          done
          test -s "$RUNNER_TEMP/alvo.url" || { cat "$RUNNER_TEMP/alvo.log"; exit 1; }
          echo "WEBQA_TARGET_URL=$(cat "$RUNNER_TEMP/alvo.url")" >> "$GITHUB_ENV"

      # Antes de MEDIR, confere que a suíte ainda detecta o que promete: um
      # check quebrado tornaria a medição de estabilidade uma mentira estável.
      - name: Contrato do alvo fixture (teste de sistema)
        run: pytest tests -m verification

      # continue-on-error de propósito: o alvo é NÃO CONFORME, então esta
      # execução reprova por definição (7 FAILs de contrato). O código de saída
      # do pytest não diz nada sobre estabilidade — quem decide é o
      # classificador, lendo o summary.json. Falha do workflow não zera streak.
      - name: Dimensão lgpd contra o fixture
        continue-on-error: true
        run: pytest -m lgpd

      # --dry-run é a garantia técnica de que este caminho não escreve: o
      # arquivo do ledger não é tocado, e nenhum passo faz commit ou push.
      # Quem registra a medição oficial é o container da VPS (docs/VPS.md).
      - name: Classificar em dry-run (não grava o ledger)
        run: python scripts/estabilidade.py --alvo-fixture --dry-run

      - name: Provar que o ledger não foi alterado
        run: |
          if [ -n "$(git status --porcelain -- docs/lgpd-estabilidade.json)" ]; then
            echo "::error::o smoke-test alterou o ledger — só a VPS pode escrever"
            git --no-pager diff -- docs/lgpd-estabilidade.json
            exit 1
          fi
          echo "Ledger intacto, como esperado."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estabilidade-${{ github.run_number }}
          path: webqa-suite/report/
          retention-days: 7
          if-no-files-found: warn
