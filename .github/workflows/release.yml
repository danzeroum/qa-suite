# Release do padrão instalável (frente E, E2): uma tag `v*` produz o wheel + sdist
# VERSIONADO como artefato do workflow. NÃO publica em índice nenhum — publicar
# (PyPI público, índice privado, etc.) é decisão do dono, adicionada depois como
# um passo a mais. Aqui o padrão vira um artefato baixável e reproduzível.
#
# A versão do artefato vem de webqa.__version__ (pyproject dynamic); a tag deve
# casar com ela. O wheel carrega só a biblioteca webqa/ (tool.setuptools.packages).
name: Release (build do wheel versionado)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Só constrói e sobe artefato; não escreve no repositório nem publica.
permissions:
  contents: read

defaults:
  run:
    working-directory: webqa-suite

jobs:
  build:
    name: Wheel + sdist do padrão
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0`: a verificação da cadeia compara a árvore taggeada com a
      # do PAI. Com clone raso o pai não existe localmente, e a guarda passaria
      # por não conseguir olhar — que é o modo de falha que ela existe para negar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A ÂNCORA, conferida antes de construir qualquer coisa (frente E, E2).
      #
      # Tag é ponteiro móvel: sem manifesto na árvore, "continua sendo o que eu
      # instalei" é indemonstrável do lado do consumidor. A guarda cobra as quatro
      # coisas que fazem a âncora valer — manifesto presente, descrevendo o pai,
      # com o commit de release não mudando mais nada, e a árvore declarando o
      # `__version__` que a tag promete. A última é a que impede o wheel de sair
      # com um número diferente do da tag, já que a versão é dinâmica.
      #
      # ANTES do build de propósito: artefato de uma tag que não ancora nada seria
      # baixável, e baixável é indistinguível de publicado.
      - name: A tag ancora um manifesto coerente
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/publicar_release.py --verificar "$TAG"

      - name: Instalar o construtor
        run: pip install build

      - name: Construir wheel + sdist
        run: python -m build

      # Confere a fronteira do pacote no artefato REAL: só webqa/ viaja — nenhuma
      # dimensão (checks/), verificação (tests/) ou ferramenta (scripts/) vaza.
      - name: Conferir a fronteira do wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          tops = sorted({n.split("/")[0] for n in zipfile.ZipFile(wheel).namelist()})
          libs = [t for t in tops if not t.endswith(".dist-info")]
          assert libs == ["webqa"], f"fronteira do wheel violada: {libs}"
          print(f"OK: {wheel} carrega só {libs}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: webqa-suite-dist
          path: webqa-suite/dist/
          retention-days: 30
          if-no-files-found: error
