# CI da WebQA Suite — verificação SEMPRE, validação só sob demanda.
#
# Separação V&V levada ao pipeline: `quality-gate` verifica a PRÓPRIA suíte
# (lint, SAST e testes de unidade, sem tocar em nenhum alvo externo) e é
# pré-requisito de qualquer validação. Mitigação técnica do risco R7
# (docs/RISCOS.md): "suíte contendo bug e aprovando alvo ruim".
#
# 12-Factor: configuração vem do ambiente (input → env WEBQA_TARGET_URL) e o
# relatório é artefato de execução com expurgo automático — nunca versionado.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL do alvo a validar (deixe vazio para rodar só o quality-gate)"
        required: false
        default: ""

# Privilégio mínimo: o pipeline só precisa ler o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webqa-suite

jobs:
  quality-gate:
    name: Verificação da suíte (lint + SAST + unidade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0`: o placar das releases confere a cadeia de cada tag
      # publicada contra o PAI dela. Com clone raso não há tag nem pai, e o placar
      # diria "0 conferidas" sem que nada estivesse errado — verde por não olhar,
      # que é a classe de defeito que os placares deste job existem para fechar.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webqa-suite/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Sem Chromium, os 4 testes de tests/test_alvo_fixture.py PULAM com motivo
      # e o quality-gate fica verde sem ter conferido o contrato 1:1 do alvo
      # fixture — exatamente o cenário do R7 que este job existe para cobrir.
      # O skip é honesto (não vira PASS), mas silencioso no código de saída.
      - name: Instalar Chromium (o contrato do fixture exige navegador)
        run: python -m playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check webqa checks tests scripts fixture_target

      - name: SAST — biblioteca (rigor total)
        run: bandit -q -c pyproject.toml -r webqa scripts fixture_target

      # Nos checks, capturar Exception é intencional: falha de rede num sinal
      # opcional vira skip/xfail explicado, não derruba a suíte. Mesma decisão
      # já registrada nos per-file-ignores do ruff (pyproject.toml).
      - name: SAST — checks (exceções documentadas)
        run: bandit -q -c pyproject.toml -r checks --skip B101,B110,B112

      # Cobertura de CÓDIGO de webqa/ (coverage.py) — outra métrica que a
      # "cobertura de execução" do cockpit: mede quais LINHAS foram atingidas.
      # Piso só aqui (job determinístico, sem alvo externo); 78% = margem sob os
      # 81% medidos. Apagar um teste que baixe a cobertura reprova o gate.
      - name: Verificação (unidade, sem alvo externo)
        run: pytest tests -m verification --cov=webqa --cov-report=term
             --cov-report=json:report/coverage.json --cov-fail-under=78

      # Placar das ancoras arquivo:linha (OS-57). A REPROVACAO ja aconteceu no
      # passo acima (tests/test_ancoras.py); este passo existe pelo PLACAR.
      #
      # Sem ele o run fica verde sem ninguem ver quantos documentos estao
      # PENDENTES, e "guarda de ancoras verde" passa a ser lido como "a
      # documentacao esta conferida" quando significa "a parte que alguem
      # conferiu esta conferida". E a mesma classe que o smoke de GUI abaixo
      # fecha com script proprio: verde que nao diz o que exerceu.
      #
      # `make verify` roda isto localmente; aqui vai explicito porque o job chama
      # o pytest direto, e nao o alvo do Makefile.
      - name: Placar das ancoras da documentacao
        run: python scripts/afere_ancoras.py

      # Coletores JS_ de webqa/ que nenhum check executa (OS-52). Passo proprio
      # pela mesma licao do placar de ancoras: a reprovacao ja aconteceu no
      # pytest acima, mas o NUMERO so aparece se alguem o imprimir.
      - name: Placar dos coletores sem consumidor
        run: python scripts/afere_simbolos.py

      # Mapa criterio WCAG -> teste (OS-53). Bidirecional: nodeid citado que a
      # coleta nao produz reprova, e check de gui que o mapa nao conhece tambem.
      - name: Placar do mapa de conformidade
        run: python scripts/exporta_conformidade.py --placar

      # Placar das releases ancoradas (frente E, E2). Mesma licao dos placares
      # acima, aplicada a outra guarda: a cadeia de uma release (manifesto na
      # arvore taggeada, descrevendo o pai, com o commit de release nao mudando
      # mais nada) e conferida no `release.yml` quando a tag NASCE — e o gesto
      # perigoso, mover uma tag ja publicada, acontece depois. Aqui ela e
      # reconferida com o codigo da ponta a cada push.
      #
      # Manifesto sem tag e AVISO com placar, nao vermelho: o manifesto entra na
      # arvore pelo PR e a tag nasce do merge dele, entao reprovar aqui impediria
      # de mergear exatamente o PR que publica a release.
      - name: Placar das releases ancoradas
        run: python scripts/publicar_release.py --aferir

      # ---------- Smoke de GUI ----------
      #
      # A dimensao `gui` ja e exercida na direcao "reprova o que deve": o
      # contrato 1:1 (tests/test_alvo_fixture.py, dentro do passo acima) roda os
      # checks contra o alvo fabricado e exige os FAILs exatos do contrato.
      # O numero vive em fixture_target/esperado.json, nunca aqui: comentario
      # que repete contagem envelhece calado (este dizia 18 ate a OS-57).
      #
      # O que FALTA, e e o que este smoke acrescenta, e a direcao oposta: um
      # check de GUI nao pode reprovar uma pagina CONFORME. O alvo fabricado tem
      # uma - a politica de privacidade - e ela e o unico lugar deste job em que
      # os checks rodam esperando verde. Falso positivo em bateria de
      # acessibilidade custa a credibilidade da bateria inteira, e esta e a
      # barreira que o pega antes de chegar num alvo real.
      #
      # Contra o alvo FABRICADO, em loopback: nenhum alvo externo, nenhuma carga
      # (-m "gui and not load", e WEBQA_LOAD_AUTHORIZED segue ausente).
      - name: Subir o alvo fabricado e apontar o smoke para a pagina conforme
        run: |
          python fixture_target/servir.py --url-file /tmp/alvo-gui.txt &
          for _ in $(seq 1 40); do [ -s /tmp/alvo-gui.txt ] && break; sleep 0.5; done
          test -s /tmp/alvo-gui.txt
          echo "WEBQA_TARGET_URL=$(cat /tmp/alvo-gui.txt)/privacidade" >> "$GITHUB_ENV"
          echo "NO_PROXY=*" >> "$GITHUB_ENV"
          echo "no_proxy=*" >> "$GITHUB_ENV"
          echo "WEBQA_REPORT_DIR=report/smoke-gui" >> "$GITHUB_ENV"

      - name: Smoke de GUI contra a pagina conforme
        run: pytest -m "gui and not load" -q

      # A licao do D6: sem Chromium os checks de `gui` PULAM, o pytest sai 0 e o
      # job ficaria verde sem ter exercido nada. Script proprio, e nao trecho
      # embutido, para a guarda tambem ter teste (tests/test_afere_smoke_gui.py).
      - name: O smoke exercitou os checks de GUI
        run: python scripts/afere_smoke_gui.py report/smoke-gui/summary.json

      # Liga o "motor" do cockpit (D5k): medicoes.json a partir da cobertura recém
      # medida + ruff C901; depois o cockpit veste tudo. Ambiente limpo (sem gate
      # de rede) — a espinha do cockpit fica serena, como deve. Não bloqueia o PR.
      - name: Cockpit de testes (com medição)
        run: |
          python scripts/medicoes.py
          python scripts/cockpit.py --html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webqa-report-quality-gate
          path: webqa-suite/report/
          retention-days: 7
          if-no-files-found: ignore

  # ---------- O caminho de instalação declarado (frente E, E1) ----------
  #
  # `tests/test_empacotamento.py` trava a FORMA do caminho (origem, subdiretório,
  # tag) lendo o README. Forma não é matéria: um caminho sintaticamente perfeito
  # pode não resolver — foi exatamente o que acontecia até aqui, com o README
  # dizendo `pip install webqa-suite` para um pacote que não está em índice nenhum
  # e cujo pyproject.toml não vive na raiz do repositório.
  #
  # Este job INSTALA. Ambiente limpo (nenhum `pip install -r requirements.txt`
  # antes), origem REAL (a mesma URL do README), e a única coisa trocada é a
  # referência: a tag declarada vira o commit sob teste, que é o conteúdo que este
  # push está propondo. A string vem do próprio README via
  # scripts/caminho_de_instalacao.py — se o job a montasse sozinho, provaria a si
  # mesmo, e o README poderia perder o `#subdirectory=` sem nada ficar vermelho.
  #
  # Não depende do quality-gate: são perguntas independentes ("a suíte se verifica"
  # × "o padrão se instala"), e encadeá-las só esconderia a segunda atrás da
  # primeira. Reprodução offline: `make instalacao`.
  instalacao-declarada:
    name: O caminho de instalação do README resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O commit precisa estar EM danzeroum/qa-suite para a origem declarada
    # alcançá-lo. Num PR de fork ele está no fork, e o job falharia dizendo que a
    # instalação quebrou quando o que falta é o commit ter chegado aqui — falso
    # vermelho é tão caro quanto falso verde, porque ensina a ignorar o job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ambiente do consumidor, não o da suíte: quem instala o padrão não tem o
      # requirements.txt de desenvolvimento. As dependências de runtime têm de vir
      # do próprio pyproject, e é isso que este passo prova sem dizer.
      - name: Instalar o padrão pelo caminho DECLARADO no README
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SPEC="$(python scripts/caminho_de_instalacao.py --ref "$SHA")"
          echo "caminho declarado (com o commit sob teste): $SPEC"
          python -m venv /tmp/venv-instalacao
          /tmp/venv-instalacao/bin/pip install "$SPEC"

      - name: A versão resolvida é a que o padrão declara
        run: |
          python - <<'PY'
          import subprocess, sys, pathlib
          sys.path.insert(0, ".")
          from webqa import __version__ as esperado
          medida = subprocess.run(
              ["/tmp/venv-instalacao/bin/python", "-c",
               "import importlib.metadata as m; print(m.version('webqa-suite'))"],
              capture_output=True, text=True, check=True).stdout.strip()
          assert medida == esperado, f"instalado {medida!r}, declarado {esperado!r}"
          print(f"OK: pip resolveu webqa-suite=={medida}")
          PY

      # O console script é o que torna o pacote UTILIZÁVEL — sem ele o `pip
      # install` teria sucesso e a adoção falharia no primeiro comando.
      - name: O console script responde
        run: /tmp/venv-instalacao/bin/webqa-sondar --help

      # A fronteira do wheel, medida no ambiente INSTALADO (o release.yml a mede no
      # artefato). checks/, tests/, scripts/ e fixture_target/ não são o padrão
      # instalável: se vazassem, um consumidor herdaria os testes DA SUÍTE como se
      # fossem dele.
      - name: Só a biblioteca chegou ao ambiente instalado
        # `-P`: sem o diretório corrente no sys.path. O passo roda em webqa-suite/,
        # que TEM checks/ e tests/ no disco — sem a flag, a guarda acusaria vazamento
        # olhando para o repositório em vez de para o ambiente instalado.
        run: |
          /tmp/venv-instalacao/bin/python -P - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("webqa") is not None, "webqa não foi instalado"
          for proibido in ("checks", "tests", "scripts", "fixture_target", "conftest"):
              assert importlib.util.find_spec(proibido) is None, \
                  f"{proibido} vazou para o ambiente instalado"
          print("OK: só webqa/ viaja")
          PY

  validate-target:
    name: Validação contra alvo real
    needs: quality-gate            # nenhuma validação sem verificação verde
    if: github.event_name == 'workflow_dispatch' && inputs.target_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEBQA_TARGET_URL: ${{ inputs.target_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webqa-suite/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      # -m "not load": carga NUNCA roda em CI. WEBQA_LOAD_AUTHORIZED não é
      # definido aqui, e o marcador é a segunda barreira — gerar carga exige
      # autorização documentada do dono do alvo (R1).
      # --cov aqui MEDE e reporta (é a execução que cobre os checks/), mas NÃO
      # trava: depende de alvo externo responder, e piso viraria flake de rede em
      # reprovação de PR. Sem --cov-fail-under de propósito.
      - name: Suíte completa (sem carga)
        run: pytest -m "not load" --cov=webqa --cov-report=term

      # Passo informativo: classifica a execução (flake de infra × veredito
      # sobre o alvo) e mostra a sequência sem flake — critério de saída da
      # Fase 1. --dry-run porque o CI tem `contents: read` e NÃO commita o
      # ledger: aqui o número é observado, não persistido. Para avançar a
      # sequência de verdade, rode o script localmente e commite o ledger.
      - name: Estabilidade da dimensão browser (informativo)
        if: always()
        run: python scripts/estabilidade.py --dry-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webqa-report
          path: |
            webqa-suite/report/
            webqa-suite/docs/lgpd-estabilidade.json
          retention-days: 7        # expurgo automático (minimização, R8)
          if-no-files-found: warn
