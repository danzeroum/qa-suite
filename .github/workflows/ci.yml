# CI da WebQA Suite — verificação SEMPRE, validação só sob demanda.
#
# Separação V&V levada ao pipeline: `quality-gate` verifica a PRÓPRIA suíte
# (lint, SAST e testes de unidade, sem tocar em nenhum alvo externo) e é
# pré-requisito de qualquer validação. Mitigação técnica do risco R7
# (docs/RISCOS.md): "suíte contendo bug e aprovando alvo ruim".
#
# 12-Factor: configuração vem do ambiente (input → env WEBQA_TARGET_URL) e o
# relatório é artefato de execução com expurgo automático — nunca versionado.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL do alvo a validar (deixe vazio para rodar só o quality-gate)"
        required: false
        default: ""

# Privilégio mínimo: o pipeline só precisa ler o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webqa-suite

jobs:
  quality-gate:
    name: Verificação da suíte (lint + SAST + unidade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webqa-suite/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check webqa checks tests

      - name: SAST — biblioteca (rigor total)
        run: bandit -q -c pyproject.toml -r webqa

      # Nos checks, capturar Exception é intencional: falha de rede num sinal
      # opcional vira skip/xfail explicado, não derruba a suíte. Mesma decisão
      # já registrada nos per-file-ignores do ruff (pyproject.toml).
      - name: SAST — checks (exceções documentadas)
        run: bandit -q -c pyproject.toml -r checks --skip B101,B110,B112

      - name: Verificação (unidade, sem alvo externo)
        run: pytest tests -m verification

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webqa-report-quality-gate
          path: webqa-suite/report/
          retention-days: 7
          if-no-files-found: ignore

  validate-target:
    name: Validação contra alvo real
    needs: quality-gate            # nenhuma validação sem verificação verde
    if: github.event_name == 'workflow_dispatch' && inputs.target_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEBQA_TARGET_URL: ${{ inputs.target_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webqa-suite/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      # -m "not load": carga NUNCA roda em CI. WEBQA_LOAD_AUTHORIZED não é
      # definido aqui, e o marcador é a segunda barreira — gerar carga exige
      # autorização documentada do dono do alvo (R1).
      - name: Suíte completa (sem carga)
        run: pytest -m "not load"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webqa-report
          path: webqa-suite/report/
          retention-days: 7        # expurgo automático (minimização, R8)
          if-no-files-found: warn
