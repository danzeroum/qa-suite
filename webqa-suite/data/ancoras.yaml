# Cobertura DECLARADA das âncoras `arquivo:linha` da documentação.
#
# Conferido por `scripts/afere_ancoras.py` e por `tests/test_ancoras.py`. Leia o
# módulo para o PORQUÊ; aqui fica só o mapa.
#
# Três estados, e todo documento precisa de um:
#
#   auditado  — as âncoras foram LIDAS uma a uma e cada uma tem fragmento
#               distintivo abaixo. A guarda é bidirecional: âncora fora do mapa
#               reprova, entrada órfã também.
#   pendente  — ainda não auditado, COM MOTIVO e com a tranche em que entra. É
#               contado e impresso em toda execução: cobertura parcial silenciosa
#               induz mais confiança do que cobertura nenhuma.
#   congelado — fotografia de um estado passado, COM MOTIVO. Atualizar as âncoras
#               falsificaria o que o documento existe para registrar.
#
# O fragmento é CURTO e distintivo (nome de função, chave, trecho de comentário
# que só existe ali) — nunca a linha inteira. Linha inteira transforma qualquer
# ajuste de redação em vermelho, e guarda que grita por qualquer coisa é
# desligada.
#
# Tranche 1 (OS-57): GUI.md, GUI-CATALOGO.md, OS-gui-fila.md, PROXIMOS-PASSOS.md.
# Dez âncoras mentiam e foram corrigidas no mesmo PR.

