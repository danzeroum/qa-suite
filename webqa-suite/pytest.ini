[pytest]
pythonpath = .
testpaths = checks tests
addopts = -ra --strict-markers -p webqa.report
markers =
    backend: testes de backend puro via HTTP (latencia, headers, cache, erros)
    frontend: qualidade de HTML/CSS/JS e renderizacao
    ux: heuristicas de usabilidade, arquitetura de informacao e acessibilidade
    gui: qualidade nao funcional da interface RENDERIZADA (foco, reflow, alvo de toque, tema, movimento, interacao) - falha prova defeito de interface, passar nao certifica usabilidade
    functional: testes funcionais (links, formularios)
    acceptance: cenarios BDD de aceitacao (validacao)
    lgpd: conformidade de privacidade observavel de fora (LGPD/LBI) - falha prova nao conformidade, passar nao certifica
    seguranca: seguranca da informacao sobre o que o navegador baixa (passivo; ativo exige gate)
    browser: exige navegador (Playwright/Chromium)
    load: teste de carga (mais lento/agressivo)
    verification: testes da propria suite (verificacao)
