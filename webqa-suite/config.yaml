# Alvo e orçamentos de qualidade da WebQA Suite.
# Sobreponha com variáveis de ambiente: WEBQA_TARGET_URL, WEBQA_TTFB_MS, etc.
target_url: "https://example.com"

http:
  timeout_s: 15
  user_agent: "WebQA-Suite/1.0 (+automated quality checks)"

crawl:
  max_pages: 15        # limite do crawler de links (respeite o alvo!)
  same_host_only: true

load_burst:            # rajada leve embutida (pytest -m load)
  requests: 30
  concurrency: 10

lgpd:
  # Terceiros liberados pelo controlador (host ou domínio; subdomínios incluídos).
  # Preencher só com decisão documentada — a allowlist SILENCIA o teste.
  # Ex.: ["googletagmanager.com"] quando a tag só dispara após consentimento.
  allowed_third_parties: []

thresholds:
  ttfb_ms: 800
  p50_ms: 800
  p95_ms: 1500
  p99_ms: 3000
  page_weight_kb: 3000
  html_kb: 300
  css_files_max: 10
  js_files_max: 20
  blocking_scripts_max: 3
  fcp_ms: 1800
  lcp_ms: 2500
  cls: 0.1
  dcl_ms: 3000
  max_console_errors: 0
  a11y_critical_max: 0
  a11y_serious_max: 0
  # Dimensao gui (OS-42). So NUMERO cabe aqui: load_settings faz float() em
  # toda chave. Viewport, mascara e politica vao para data/gui-perfis.yaml.
  gui_overflow_x_px: 0        # WCAG 1.4.10 — rolagem horizontal a 320 CSS px
  gui_zoom_perdidos_max: 0    # WCAG 1.4.4 — conteudo que some a 200%
  gui_alvo_toque_px: 24       # WCAG 2.5.8 AA
  gui_alvo_toque_meta_px: 44  # meta de plataforma: abaixo disso e ALERTA, nao achado
  gui_foco_invisivel_max: 0   # WCAG 2.4.7 — um controle sem indicador ja quebra a cadeia
  # WCAG 2.4.3. FOLGADO de proposito na Fase 1: a inversao e medida por
  # geometria, e a geometria nao conhece a intencao do layout. Grade densa
  # produz salto legitimo; limiar zero reprovaria layout conforme.
  gui_foco_inversoes_max: 2
  gui_foco_obscurecido_max: 0 # WCAG 2.4.11 (nova na 2.2)
  gui_animacoes_sob_rm_max: 0 # WCAG 2.3.3 — sob reduced-motion, nada se mexe
  # GUI-PERF-01 (OS-46). Orcamento de interatividade: so reprova sob
  # WEBQA_ORIGEM=vps; fora do ambiente oficial o estouro vira xfail com motivo.
  # Afrouxar estes numeros para caber na maquina mais barulhenta seria o R5.
  gui_tbt_ms: 200             # Total Blocking Time — faixa "bom" do Lighthouse
  gui_inp_ms: 200             # INP aproximado; "bom" do Core Web Vitals
  gui_long_tasks_max: 5       # tarefas acima de 50ms; TBT e contagem NAO se reduzem
  # GUI-RESIL (OS-47). Erros de console contados em relacao a carga SAUDAVEL: o
  # alvo que ja erra antes da falha nao pode ser cobrado aqui pelo defeito de
  # outro check. Tentativas com comparador `>`: recuo exponencial e legitimo.
  gui_console_erros_pos_falha_max: 3
  gui_resil_tentativas_max: 5
  # GUI-RESP-03/05 e GUI-COMPAT-01 (OS-48).
  # Fracao da MENOR caixa: um botao pequeno coberto por um painel grande esta
  # 100% inacessivel, e dividir pela area do painel diria "quase nada".
  gui_sobreposicao_fracao: 0.30
  gui_sobreposicao_max: 0
  # Antialiasing, sub-pixel e metricas de fonte diferem por engine. Abaixo de 4px
  # o desvio e da engine, nao do layout — e reprovar por isso enterraria o sinal
  # verdadeiro numa lista de diferencas de 1px.
  gui_compat_tolerancia_px: 4
