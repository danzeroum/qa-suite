[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webqa-suite"
# Fonte ÚNICA da versão: webqa.__version__ (E4). A procedência do laudo carimba
# essa mesma versão — se o pyproject a duplicasse, um laudo poderia mentir a régua.
dynamic = ["version"]
description = "Testes genéricos de qualidade (performance, funcionalidade, UX) para qualquer aplicação web via HTTP"
readme = "README.md"
requires-python = ">=3.11"
# Dependências de RUNTIME da biblioteca webqa/ (o motor). playwright é do
# navegador (dimensão browser), não do motor — fica em extra opcional para o
# `pip install webqa-suite` do padrão não arrastar Chromium sem necessidade.
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright==1.56.0"]

# Entrypoint instalável (frente E, E1): é o que torna possível DECLARAR a suíte
# como dependência em vez de COPIÁ-la (docs/…/ARQUITETURA §9). Por ora só o motor
# de sondagem; cockpit/catalogo/medicoes seguem como `python scripts/…` até a
# decisão do comando unificado `webqa <sub>` (que exigiria movê-los para webqa/).
[project.scripts]
webqa-sondar = "webqa.sondagem:main"

[tool.setuptools]
# Só a BIBLIOTECA viaja no wheel do padrão. checks/ (dimensões), tests/
# (verificação), scripts/ (ferramenta) e fixture_target/ (alvo fabricado) não são
# o padrão instalável — são como ele é desenvolvido e provado.
packages = ["webqa"]

[tool.setuptools.dynamic]
version = { attr = "webqa.__version__" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# C901: gate de complexidade ciclomática. Teto 8 (Q1d) — a 10 nenhuma função de
# webqa/ é pega, e um gate que passa limpo no motor não vigia nada.
select = ["E", "F", "W", "I", "B", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 8

# Nos checks, capturar Exception é intencional: falha de rede num sinal
# opcional não deve derrubar a suíte — vira skip/xfail explicado.
[tool.ruff.lint.per-file-ignores]
"checks/**" = ["B017", "BLE001", "S110", "S112", "C901"]
# webqa/report_style.py e o pacote de design sao COPIA VERBATIM do contrato
# visual (bloco <style> da referencia, identico byte a byte). Reformatar para
# caber em 110 colunas quebraria justamente a propriedade que se quer garantir.
"webqa/report_style.py" = ["E501"]
# C901: scripts/ QUITADO (Q1d) — todos os offenders refatorados, o gate de
# complexidade agora vigia scripts/ igual à biblioteca. Resta só fixture_target/,
# que é ALVO FABRICADO, não código de produção: um HTML/servidor de teste
# deliberadamente imperfeito não presta contas de complexidade a ninguém.
"fixture_target/**" = ["C901"]

[tool.bandit]
skips = ["B101"]  # assert é o mecanismo do pytest
